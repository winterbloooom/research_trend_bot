- name: Autonomous Game Agents & Game-as-Testbed
  keywords:
  - NPC
  - believable agent
  - generative agent
  - autonomous character
  - character agent
  - agent societies
  - life simulation
  - social simulation
  - open-ended agent
  - Minecraft agent
  - sandbox agent
  - embodied agent
  - situational awareness
  - situated agent
  - strategic reasoning
  - long-horizon decision making
  - autonomous decision making
  - game environment
  - game-based evaluation
  - game testbed
  - interactive fiction agent
  - StarCraft
  - RTS
  - FPS
  - game world model
  - playable environment
  - vision-language model for games
  - VLM for games
  arxiv_categories:
  - cs.AI
  - cs.LG
  - cs.MA
  special_instructions: 'Focus on two axes: (1) autonomous, self-directed agents that
    act with agency like NPCs or believable characters; and (2) games (and game-like
    simulations) used as a testbed for deep situational understanding and autonomous
    decision-making. Deprioritize papers that merely maximize score on classic RL
    benchmarks (e.g. Atari) without agentic autonomy or situated reasoning. Explicitly
    exclude papers focused on real-world robotics, autonomous driving, vehicle-to-everything
    (V2X) communication, general 3D perception, or other physical systems.'
