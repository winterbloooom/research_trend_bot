  - VLM for games
  arxiv_categories:
  - cs.AI
  - cs.LG
  - cs.MA
  special_instructions: 'Focus on two axes: (1) autonomous, self-directed agents that
    act with agency like NPCs or believable characters; and (2) games (and game-like
    simulations) used as a testbed for deep situational understanding and autonomous
    decision-making. Deprioritize papers that merely maximize score on classic RL
    benchmarks (e.g. Atari) without agentic autonomy or situated reasoning. Explicitly
    exclude papers focused on real-world robotics, autonomous driving, vehicle-to-everything
    (V2X) communication, or other physical systems.'

filtering:
  score_threshold: 5
  top_k: 6
  max_papers_per_interest: 50
language: ko
days_back: 1
